id: com.wakunguma.Mukwa
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: mukwa
rename-icon: mukwa
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.a11y.Bus
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin"
modules:
  - name: mukwa
    buildsystem: simple
    build-options:
      no-debuginfo: true
      env:
        CARGO_HOME: /run/build/mukwa/cargo
        CARGO_NET_OFFLINE: 'true'
        SKIA_BINARIES_URL: file:///run/build/mukwa/skia-binaries.tar.gz
    build-commands:
      - rm -f .cargo/config.toml rust-toolchain.toml
      - cargo fetch --offline
      - cargo build --offline -r -p mukwa --no-default-features
      - install -Dm755 target/release/mukwa /app/bin/mukwa
      - install -Dm644 crates/mukwa/resources/icons/app-icon.svg /app/share/icons/hicolor/scalable/apps/mukwa.svg
      - install -Dm644 crates/mukwa/resources/mukwa.desktop /app/share/applications/com.wakunguma.Mukwa.desktop
      - install -Dm644 crates/mukwa/resources/mukwa.metainfo.xml /app/share/metainfo/com.wakunguma.Mukwa.metainfo.xml
    sources:
      - type: git
        url: https://github.com/snubwoody/mukwa.git
        commit: b32dd75a74e6cdd872b325f847924a0eca8c8e11
      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.157.0/skia-binaries-30669978c3f39a73e8a7-x86_64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf-vulkan.tar.gz
        dest-filename: skia-binaries.tar.gz
        sha256: 6e3dbc01dd725d31598513f24a3eb4cdd161eaf7530d355839f4447f01f94fbc
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/rust-skia/skia-binaries/releases/download/0.157.0/skia-binaries-30669978c3f39a73e8a7-aarch64-unknown-linux-gnu-ganesh-gl-jpegd-jpege-pdf-vulkan.tar.gz
        dest-filename: skia-binaries.tar.gz
        sha256: 97867bf5aebc2c5197199db5f1356a76d420b821be1776a3e5fb69510b1693f7
        only-arches:
          - aarch64
      - cargo-sources.json
